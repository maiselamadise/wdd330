<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>

    <!-- FIXED: relative path for GitHub Pages + Vite -->
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
<header class="site-header">
  <div class="logo">
    <img
      src="/src/public/images/noun_Tent_2517.svg"
      alt="SleepOutside tent logo"
    />
    <a href="/index.html">
      Sleep<span class="highlight">Outside</span>
    </a>
  </div>

  <div class="cart">
    <a href="/src/cart/index.html" aria-label="View cart">
      <!-- cart SVG -->
    </a>
  </div>
</header>

  <body>
    <!-- Dynamic Header -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <div class="hero">
        <!-- FIXED: relative image paths -->
        <img
          src="./public/images/banner-sm.jpg"
          srcset="
            ./public/images/banner-sm.jpg 500w,
            ./public/images/banner.jpg 1000w
          "
          sizes="(max-width: 600px) 500px, 1000px"
          alt="image of a high mountain lake"
        />

        <!-- Product Categories -->
        <section class="categories">
          <a href="./product_listing/index.html?category=tents">
            <img src="./public/images/tents.svg" alt="Tents" />
            <p>Tents</p>
          </a>

          <a href="./product_listing/index.html?category=backpacks">
            <img src="./public/images/backpacks.svg" alt="Backpacks" />
            <p>Backpacks</p>
          </a>

          <a href="./product_listing/index.html?category=sleeping-bags">
            <img src="./public/images/sleepingbags.svg" alt="Sleeping Bags" />
            <p>Sleeping Bags</p>
          </a>

          <a href="./product_listing/index.html?category=hammocks">
            <img src="./public/images/hammocks.svg" alt="Hammocks" />
            <p>Hammocks</p>
          </a>
        </section>

        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>
    </main>

    <!-- Dynamic Footer -->
    <footer id="main-footer"></footer>

    <!-- FIXED: relative JS path -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
