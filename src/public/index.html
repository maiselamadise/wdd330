<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>

  <body>
    <!-- Dynamic Header -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <div class="hero">
        <img
          src="/src/public/images/banner-sm.jpg"
          srcset="
            /src/public/images/banner-sm.jpg 500w,
            /src/public/images/banner.jpg 1000w
          "
          alt="image of a high mountain lake"
        />

        <section class="categories">
          <a href="product_listing/index.html?category=tents">
            <img src="/src/public/images/tents.svg" alt="Tents" />
            <p>Tents</p>
          </a>

          <a href="product_listing/index.html?category=backpacks">
            <img src="/src/public/images/backpacks.svg" alt="Backpacks" />
            <p>Backpacks</p>
          </a>

          <a href="product_listing/index.html?category=sleeping-bags">
            <img src="/src/public/images/sleepingbags.svg" alt="Sleeping Bags" />
            <p>Sleeping Bags</p>
          </a>

          <a href="product_listing/index.html?category=hammocks">
            <img src="/src/public/images/hammocks.svg" alt="Hammocks" />
            <p>Hammocks</p>
          </a>
        </section>

        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>
    </main>

    <!-- Dynamic Footer -->
    <footer id="main-footer"></footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
