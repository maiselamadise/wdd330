<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- HEADER PARTIAL -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products checkout">
        <h2>Review &amp; Place Your Order</h2>

        <!-- CHECKOUT FORM -->
        <form id="checkoutForm" class="checkout-form" novalidate>
          <!-- SHIPPING -->
          <fieldset>
            <legend>Shipping Information</legend>

            <label>
              First Name
              <input type="text" name="fname" required minlength="2" />
            </label>

            <label>
              Last Name
              <input type="text" name="lname" required minlength="2" />
            </label>

            <label>
              Address
              <input type="text" name="address" required />
            </label>

            <label>
              City
              <input type="text" name="city" required />
            </label>

            <label>
              State
              <input type="text" name="state" required />
            </label>

            <label>
              ZIP Code
              <input
                type="text"
                name="zip"
                pattern="[0-9]{5}"
                placeholder="12345"
                required
              />
            </label>
          </fieldset>

          <!-- PAYMENT -->
          <fieldset>
            <legend>Payment</legend>

            <label>
              Credit Card Number
              <input
                type="text"
                name="cardNumber"
                inputmode="numeric"
                pattern="[0-9]{16}"
                placeholder="1234567812345678"
                required
              />
            </label>

            <label>
              Expiration Date
              <input
                type="text"
                name="expiration"
                placeholder="MM/YY"
                required
              />
            </label>

            <label>
              CVV
              <input
                type="text"
                name="code"
                inputmode="numeric"
                pattern="[0-9]{3}"
                required
              />
            </label>
          </fieldset>

          <button
            type="submit"
            id="checkoutSubmit"
            class="checkout-button"
          >
            Place Order
          </button>
        </form>
      </section>
    </main>

    <!-- FOOTER PARTIAL -->
    <footer class="divider" id="site-footer"></footer>

    <!-- PARTIAL LOADERS -->
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/main.js"></script>

    <!-- CHECKOUT LOGIC -->
    <script type="module">
      import CheckoutProcess from "/src/js/CheckoutProcess.mjs"

      const checkout = new CheckoutProcess(
        "so-cart",
        "/order-success.html"
      )

      document
        .querySelector("#checkoutSubmit")
        .addEventListener("click", (event) => {
          event.preventDefault()

          const form = document.querySelector("#checkoutForm")

          if (!form.checkValidity()) {
            form.reportValidity()
            return
          }

          checkout.checkout()
        })
    </script>
  </body>
</html>
